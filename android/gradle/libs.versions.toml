[versions]
agp = "9.4.1"
# AGP 9 は Kotlin を内蔵している. ここでは Compose コンパイラのプラグインの版だけを決める.
kotlin = "2.4.21"
compose-bom = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.11.0"
core-ktx = "1.19.1"
coroutines = "1.11.0"
webkit = "1.17.1"
swiperefreshlayout = "1.2.0"
junit = "4.13.2"
json = "20260814"

[libraries]
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
# Web との連絡 (bridge) を, 接続先のページからだけ受けるため (addWebMessageListener).
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "webkit" }
# WebView を下に引いて更新するため. Compose の更新の部品は WebView のスクロールと連動しない.
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
junit = { module = "junit:junit", version.ref = "junit" }
# Android の org.json は JVM の単体テストでは中身がないため, テストでだけ本物を使う.
json = { module = "org.json:json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
