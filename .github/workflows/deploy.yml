# main への push で, 点数計算アプリ (web/) を Cloudflare にデプロイする.
# チップの検出器 (core を WASM にしたものとモデル) も, ここで毎回ビルドする.
# 流れと理由は docs/architecture.md の「11. デプロイ」, 手順は docs/web/deploy.md.
#
# 本番の D1 の migration はここでは当てない. 未適用のものがあれば止まるので,
# migrate のワークフローを手で起動してから, このワークフローを再実行する.

name: deploy

on:
  push:
    branches: [main]
    # 本番に出るものの元が変わったときだけ動く. 文書や Android, テストだけのコミットでデプロイしないため.
    # 画面と API (web/) と, 検出器の元 (core/, wasm/, モデル, 検出器を作るスクリプト) のすべてを見張る.
    # 検出器の元を足したら, ここにも足す. 足し忘れると, その変更は本番に届かない.
    paths:
      - "web/**"
      - "core/**"
      - "wasm/**"
      - "models/model.lock"
      - "scripts/fetch_model.sh"
      - "scripts/fetch_emsdk.sh"
      - "scripts/fetch_opencv_source.sh"
      - "scripts/build_opencv_wasm.sh"
      - "scripts/build_wasm.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

# デプロイと migration が同時に走らないようにする. 走っているものは止めずに, 終わるのを待つ.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    # Emscripten と OpenCV のキャッシュがないときは, OpenCV のビルドで時間がかかる (手元の 4 コアで約 5 分).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      # 外部の action はコミットの SHA で固定する. タグを差し替えられても, 知らないコードを動かさないため.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: モデルを取ってくる
        run: ../scripts/fetch_model.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Emscripten と WASM 用の OpenCV は重いが, 版を変えない限り同じものなのでキャッシュする.
      # key は用意するスクリプトの hash. 版や設定を変えるとスクリプトが変わり, 作り直す.
      - name: Emscripten をキャッシュから戻す
        id: emsdk-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: third_party/emsdk
          key: emsdk-${{ hashFiles('scripts/fetch_emsdk.sh') }}

      - name: Emscripten を取ってくる
        if: steps.emsdk-cache.outputs.cache-hit != 'true'
        run: ../scripts/fetch_emsdk.sh

      - name: WASM 用の OpenCV をキャッシュから戻す
        id: opencv-wasm-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v6.1.0
        with:
          path: third_party/opencv-4.14.0-wasm
          key: opencv-wasm-${{ hashFiles('scripts/fetch_emsdk.sh', 'scripts/fetch_opencv_source.sh', 'scripts/build_opencv_wasm.sh') }}

      - name: WASM 用の OpenCV をビルドする
        if: steps.opencv-wasm-cache.outputs.cache-hit != 'true'
        run: ../scripts/build_opencv_wasm.sh

      # 検出器は毎回ビルドする. 本番の検出器が, いつもデプロイするコミットの core とモデルからできるようにするため.
      - name: 検出器をビルドする
        run: ../scripts/build_wasm.sh

      - name: 依存を入れる
        run: npm ci

      - name: 検査する
        run: npm run check

      # Cloudflare のトークンは, 本番に触る手順にだけ渡す. 依存のインストールやテストで動くコードに見せないため.
      - name: 本番の D1 に未適用の migration がないかを確かめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler は未適用のものがあっても 0 で終わるので, 出力で判断する.
          # 文言が変わったときは, デプロイしない側に倒れる.
          output="$(npx wrangler d1 migrations list DB --remote 2>&1)"
          echo "$output"
          if ! grep -q "No migrations to apply" <<<"$output"; then
            echo "::error::本番の D1 に未適用の migration があります. migrate のワークフローを起動してから, このワークフローを再実行してください."
            exit 1
          fi

      - name: 画面をビルドする
        run: npm run build

      - name: デプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
