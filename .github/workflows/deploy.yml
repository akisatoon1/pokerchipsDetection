# main への push で, 点数計算アプリ (web/) を Cloudflare にデプロイする.
# 流れと理由は docs/architecture.md の「11. デプロイ」, 手順は docs/web/deploy.md.
#
# 本番の D1 の migration はここでは当てない. 未適用のものがあれば止まるので,
# migrate のワークフローを手で起動してから, このワークフローを再実行する.

name: deploy

on:
  push:
    branches: [main]
    # Web に関わるファイルが変わったときだけ動く. C++ や文書だけのコミットでデプロイしないため.
    paths:
      - "web/**"
      - "scripts/fetch_detector.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

# デプロイと migration が同時に走らないようにする. 走っているものは止めずに, 終わるのを待つ.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      # 外部の action はコミットの SHA で固定する. タグを差し替えられても, 知らないコードを動かさないため.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依存を入れる
        run: npm ci

      - name: 検出器を取ってくる
        run: ../scripts/fetch_detector.sh
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 検査する
        run: npm run check

      # Cloudflare のトークンは, 本番に触る手順にだけ渡す. 依存のインストールやテストで動くコードに見せないため.
      - name: 本番の D1 に未適用の migration がないかを確かめる
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # wrangler は未適用のものがあっても 0 で終わるので, 出力で判断する.
          # 文言が変わったときは, デプロイしない側に倒れる.
          output="$(npx wrangler d1 migrations list DB --remote 2>&1)"
          echo "$output"
          if ! grep -q "No migrations to apply" <<<"$output"; then
            echo "::error::本番の D1 に未適用の migration があります. migrate のワークフローを起動してから, このワークフローを再実行してください."
            exit 1
          fi

      - name: 画面をビルドする
        run: npm run build

      - name: デプロイする
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
