name = "pokerchip-score"
main = "src/server/index.ts"
compatibility_date = "2026-10-01"

# 画面は Vite でビルドした静的ファイル. /api/ 以外はここから配り,
# 知らないパス (/m/{matchId} など) には index.html を返して画面側で振り分ける.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# database_id は本番の D1 の id. 秘密ではない (読み書きには API トークンが要る) のでコミットする.
# 手元の wrangler dev とテストは, この id を使わず手元の SQLite を使う.
[[d1_databases]]
binding = "DB"
database_name = "pokerchip-score"
database_id = "364b948b-c8cf-45f3-aed4-9d2392d4c484"
migrations_dir = "migrations"

# Workers Logs. 本番で 500 が出たとき, 原因を追えるのはこのログだけのため.
# ログにはトークンを出さない (src/server/index.ts の onError).
[observability]
enabled = true
